name: Compilar EXE Portable Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install llama-cpp-python==0.3.1 --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          pip install -r requirements.txt

      - name: Empaquetar con PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --console --name "AsistenteIA_Portable" --collect-all lancedb --collect-all llama_cpp --collect-all gradio --collect-all gradio_client --collect-all safehttpx --collect-all groovy src/app.py

      - name: Subir ejecutable como Release/Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsistenteIA-Windows-Portable
          path: dist/AsistenteIA_Portable.exe
